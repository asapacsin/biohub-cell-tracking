training:
  detector:
    patch_shape_zyx: [32, 128, 128]
    sigma_um: 2.0
    jitter_voxels_zyx: [2, 8, 8]
    # Next-run recipe (docs/TRAINING_IO_FIXES.md): short turnaround + frame-grouped I/O.
    epochs: 3
    batch_size: 8
    learning_rate: 0.001
    validation_fraction: 0.1
    positive_weight: 20.0
    num_workers: 4
    seed: 42
    seeds: [42]
    device: cuda
    frame_cache_size: 2
    frame_grouped_batches: true
    use_amp: true
    resume: true
    log_every: 200
    patch_mix:
      positive: 0.80
      near_miss: 0.15
      empty: 0.05
    positive_center_radius_um: 6.0
    empty_exclusion_margin_um: 4.0
    augmentation:
      enabled: true
      flip_prob: 0.5
      rot90_prob: 0.5
      intensity_scale: [0.9, 1.1]
      intensity_shift: [-0.05, 0.05]
      noise_std: 0.0
      blur_sigma_px: [0.0, 0.0]
    unet:
      in_channels: 1
      out_channels: 1
      base_channels: 16
      depth: 3
  association:
    l2_regularization: 0.001
    max_iterations: 500
    candidate_graph:
      max_neighbors: 8
      max_gap: 2
      max_speed_um_per_frame: 15.0
      divisions_enabled: true
      max_division_children: 6
      max_daughter_separation_um: 16.0
