# Public-test baseline config. All tunable knobs live here.
runtime:
  seed: 42
  save_masks: false
  save_visualizations: true
  save_detections: true
  save_tracks: true

# Official spacing from OME-NGFF metadata (µm/voxel). Used when store metadata is absent.
voxel_size_z: 1.625
voxel_size_y: 0.40625
voxel_size_x: 0.40625

detection:
  method: blob
  # DETECTION_THRESHOLD (normalized smoothed intensity)
  threshold: 0.08
  lower_percentile: 1.0
  upper_percentile: 99.8
  gaussian_sigma_um: 1.5
  minimum_separation_um: 4.0
  # Size filters reserved for connected-component detectors (unused by blob peaks)
  min_object_size: 1
  max_object_size: 100000
  min_component_volume: 1
  max_component_volume: 100000

tracking:
  method: greedy_nearest_neighbor
  # MAX_LINK_DISTANCE in µm (physical space)
  max_link_distance: 15.0
  candidate_neighbors: 5
  # Division post-pass after one-to-one linking (physical µm).
  # Thresholds from train-GEFF true-division p95 (+slack); capped per frame.
  division_enabled: true
  division_max_distance: 10.5
  max_daughter_separation: 15.5
  min_daughter_separation: 6.0
  max_midpoint_distance: 5.5
  midpoint_weight: 2.5
  separation_weight: 0.25
  volume_weight: 0.0
  max_division_candidates_per_parent: 5
  require_matched_daughter: true
  max_divisions_per_frame: 1

submission:
  node_id_start: 1
  sort_rows: true
  strict_validation: true
