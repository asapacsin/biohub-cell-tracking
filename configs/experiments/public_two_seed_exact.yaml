source:
  author: Yusuke Togashi
  title: Clean Approach + Lightweight Local CV | No Hack
  slug: yusuketogashi/clean-approach-lightweight-local-cv-no-hack
  url: https://www.kaggle.com/code/yusuketogashi/clean-approach-lightweight-local-cv-no-hack
  version: 106
  public_score: 0.908
  best_score: 0.908
  best_score_version: 96
  license: Apache-2.0
  note: Public Pilkwang dual-seed recipe A (postprocess mapped; inference uses public
    patch env)
inference:
  method: unet_transformer
  weights_relative: weights/unet_transformer/split_0/edge_predictor_best.pth
  # Public recipe loads Seed2 via BIOHUB_SECONDARY_* env (not local equal-alpha patch).
  ensemble_weights_relative: null
  ensemble_alpha: 0.5
  support_artifact: pilkwang/biohub-tracking-support-pack-50ep-v1
  prediction_script: scripts/predict_unet_transformer.py
  detection_threshold: 0.96875
  unet_batch_size: 4
  use_ilp: true
  ilp_edge_weight: -1.0
  ilp_appearance_weight: 0.0
  ilp_disappearance_weight: 1.5
  ilp_division_weight: 1.0
  spatial_d4_tta: true
postprocessing:
  output_edge_max_um: 14.0
  output_enforce_next_frame: true
  output_single_parent_repair: true
  output_single_child_repair: false
  output_prune_isolated: true
  output_motion_relink: true
  motion_relink_tight_um: 6.0
  motion_relink_relaxed_um: 10.0
  motion_relink_velocity_weight: 0.5
  motion_relink_learned_bonus: 1.0
  motion_relink_max_frame_nodes: 2600
  output_division_geometry_filter: false
  div_parent_max_um: 10.5
  div_sister_max_um: 8.0
  div_drop_to_single_if_bad: true
  output_gap_close: true
  gap_close_max_gap: 2
  gap_close_um: 5.8
  gap_density_adaptive: true
  gap_density_reference_um: 6.5
  gap_density_gain: 0.04
  gap_density_max_step_delta_um: 0.125
  gap_density_neighbors: 3
  gap_close_reuse_existing: true
  gap_close_reuse_um: 3.2
  gap_close_max_added_frac: 0.05
  gap_close_max_added_abs: 2000
  gap_refine_synthetic: true
  gap_refine_win_z: 1
  gap_refine_win_yx: 3
  gap_refine_max_shift_um: 3.2
  output_filter_short_tracks: true
  output_min_track_len: 6
  output_keep_division_components: true
  adaptive_short_track_rescue: false
  short_track_rescue_trigger_removed_frac: 0.1
  short_track_rescue_min_len: 4
  short_track_rescue_min_mean_edge_prob: 0.82
  short_track_rescue_max_mean_edge_dist_um: 3.25
  short_track_rescue_max_nodes_frac: 0.018
  short_track_rescue_max_nodes_abs: 180
  output_linefit_smooth: true
  output_linefit_weight: 0.8
  output_linefit_window: 2
  output_gap2_recovery: false
  gap2_max_total_um: 10.2
  gap2_max_step_um: 4.4
  gap2_max_links_frac: 0.0045
  gap2_max_links_abs: 180
  gap2_require_context: true
  gap2_frame_frac_cap: 0.006
  output_safe_divisions: true
  safe_div_max_um: 4.66
  safe_div_sister_max_um: 8.5
  safe_div_existing_child_max_um: 7.65
  safe_div_frame_frac_cap: 0.0076
  safe_div_global_frac_cap: 0.00375
  use_deepcenter_veto: true
  require_deepcenter_veto: true
  deepcenter_manifest_default: ''
  deepcenter_checkpoint_default: data/deepcenter/weights/full_frame_center/checkpoint_last.pt
  deepcenter_relative: weights/full_frame_center/checkpoint_last.pt
  deepcenter_gap_veto: true
  deepcenter_safe_div_veto: false
  deepcenter_gap_threshold: 0.25
  deepcenter_expected_epoch: 500
  deepcenter_gap_confirm_min_span_um: 8.5
  deepcenter_safe_div_threshold: 0.12
  deepcenter_score_win_z: 1
  deepcenter_score_win_yx: 2
  deepcenter_score_cache_max_frames: 8
  voxel_scale_um:
  - 1.625
  - 0.40625
  - 0.40625
  linefit_weight: 0.8
local_cv:
  enabled_for_submission_run: false
  fixed_dataset_count: 8
  max_match_um: 7.0
  note: Full local CV requires competition train Zarr/GEFF stores and the support
    artifact.
