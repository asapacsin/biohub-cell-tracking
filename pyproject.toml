[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "biohub-cell-tracking"
version = "0.1.0"
description = "Faithful local packaging of the public clean Biohub V106 pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]
runtime = [
  "torch>=2.5",
  "tracksdata",
  "zarr>=3.0.10,<4",
  "pyscipopt",
  "geff>=1.1.3.1.1",
  "geff-spec<1.2",
  "ilpy>=0.5.1",
  "polars>=1.36",
  "blosc2",
  "dask",
  "imagecodecs",
  "scikit-image>=0.24",
  "pyarrow",
  "rustworkx>=0.17.1",
  "sqlalchemy>=2",
  "numcodecs>=0.13,<0.16",
  "donfig>=0.8",
]

[project.scripts]
biohub-clean = "biohub_pipeline.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biohub_pipeline"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["upstream_clean_v106"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/vendor_clean_v106.py" = ["E501"]
"src/biohub_pipeline/inference.py" = ["E501"]
"src/biohub_pipeline/postprocessing.py" = ["ALL"]
"src/biohub_pipeline/evaluation.py" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["biohub_pipeline"]
