[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "biohub-cell-tracking"
version = "0.1.0"
description = "Local-first submission infrastructure for Biohub cell tracking"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-image>=0.24",
  "typer>=0.12",
  "PyYAML>=6.0",
  "zarr>=2.18,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]
parquet = ["pyarrow>=17"]

[project.scripts]
biohub-track = "biohub_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/biohub_tracker"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["biohub_tracker"]

